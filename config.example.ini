[Translation]
# 翻译API类型：edge_free(默认,国内直连) / google_free / libretranslate / bing / baidu / youdao
api_type = edge_free
libretranslate_url = https://libretranslate.com/translate
# 主API失败后的降级API（留空不降级）；是否再兜底 Edge/谷歌免费接口
# 由 allow_free_fallback 控制，默认关闭，不会自动把原文发给第三方
fallback_api_type = 
# 隐私开关（true/false）
# 缓存以明文保存原文/译文；关闭时程序会清掉已落盘的缓存文件
cache_enabled = true
# 退出程序时清空翻译缓存
clear_cache_on_exit = false
# 主接口失败时允许自动改用 Edge/Google 免费接口（会把原文发给第三方）
allow_free_fallback = false
# 启动时预热当前免费翻译接口（会在你没截图时发起一次请求）
warm_up = false
# 目标语言：zh(中文) / en(英文)
target_lang = zh
bing_api_key = 
# 必应/Azure 区域资源需填区域（如 eastasia），全球资源留空；也可用环境变量 BING_REGION
bing_region = 
baidu_api_key = 
baidu_app_id = 
youdao_api_key = 
youdao_app_id = 

[OCR]
# OCR 固定使用本地 RapidOCR，这里只保留识别参数
# 行置信度下限(0~1)：低于该值的检测结果不送去翻译
rapidocr_score_threshold = 0.5

[Overlay]
# 截图遮罩：磁吸阈值(像素,0~48) 与 暗角透明度(0~180)
snap_threshold = 12
dim_opacity = 90

[Capture]
# 纯截图（不翻译）的标注、输出与滚动截图参数
# 保存格式：png / jpg / webp（WEBP 插件缺失时自动退回 PNG）
format = png
# JPG/WEBP 质量(1~100)
jpg_quality = 90
# 保存目录，留空=系统「图片」目录
save_dir = 
# 文件名模板（strftime，扩展名自动补）
filename_template = 截图_%Y%m%d_%H%M%S
# true=保存时不弹文件对话框，直接按模板写入
quick_save = false
# 保存后动作：none / copy / close / copy_close
after_save = none
# 标注默认颜色、线宽(px)、字号(px)
pen_color = #ff3b30
pen_width = 4
font_size = 18
# 框选时显示放大镜与坐标/RGB
magnifier = true
# 长截图（自己滚动页面）：抓帧间隔(ms)、长图最大高度(px)
scroll_poll_ms = 120
scroll_max_height = 12000

[Hotkey]
# 全局截图翻译快捷键
global_hotkey = alt+z
# 全局纯截图快捷键（只截图，不识别不翻译）
capture_hotkey = ctrl+alt+z
# 全局打开文本翻译页的快捷键
translate_hotkey = ctrl+alt+t
# 全屏截图（直接抓整屏进编辑态）
fullscreen_hotkey = ctrl+alt+f
# 活动窗口截图（抓当前前台窗口）
window_hotkey = ctrl+alt+w
# 重复上次框选区域
repeat_hotkey = ctrl+alt+r

[Startup]
# 启动后最小化到托盘（true/false）
minimize_to_tray = true
# 开机自启动（true/false）
auto_start = false

[Update]
# 启动时检查 GitHub 上的新版本（true/false）
auto_check = true
# 最近一次已推送过更新的版本（程序自动维护，一般不用手改）
last_notified_version =
