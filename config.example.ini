[Translation]
# 翻译API类型：edge_free(默认,国内直连) / google_free / libretranslate / bing / baidu / youdao / llm
api_type = edge_free
libretranslate_url = https://libretranslate.com/translate
# 主API失败后的降级API（留空不降级；降级链最后会自动尝试 Edge/谷歌 免费接口）
fallback_api_type = 
# 目标语言：zh/zh-TW/en/ja/ko/fr/de/es/ru
target_lang = zh
bing_api_key = 
baidu_api_key = 
baidu_app_id = 
youdao_api_key = 
youdao_app_id = 
# LLM（OpenAI兼容接口）：OpenAI/DeepSeek/通义/Kimi/本地Ollama
llm_base_url = https://api.openai.com/v1
llm_api_key = 
llm_model = gpt-4o-mini

[OCR]
# OCR引擎：tesseract(默认,本地离线) / baidu_cloud(在线,中文更佳) / mock
ocr_type = tesseract
# 识别语言组合，如 eng+chi_sim
tesseract_langs = eng+chi_sim
baidu_ocr_api_key = 
baidu_ocr_secret_key = 

[Overlay]
# 截图遮罩：磁吸阈值(像素,0~48) 与 暗角透明度(0~180)
snap_threshold = 12
dim_opacity = 90

[UI]
# 界面主题：dark(深色,默认) / light(浅色白色主题)
theme = dark

[Hotkey]
# 全局截图翻译快捷键
global_hotkey = alt+z

[Startup]
# 启动后最小化到托盘（true/false）
minimize_to_tray = true
