<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>图标预览</title>
<style>
body { background: #1e2430; display: flex; gap: 48px; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
.card { text-align: center; color: #aab; }
.card img { display: block; margin: 0 auto 8px; }
</style>
</head>
<body>
<div class="card"><img src="icon.png" width="256" height="256"><div>256px</div></div>
<div class="card"><img src="icon.png" width="64" height="64"><div>64px</div></div>
<div class="card"><img src="icon.png" width="32" height="32"><div>32px</div></div>
<div class="card"><img src="icon.png" width="16" height="16"><div>16px</div></div>
</body>
</html>
